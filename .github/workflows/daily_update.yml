name: Daily NBA Data Update

on:
  schedule:
    # Runs every day at 08:00 UTC (3:00 AM EST / 4:00 AM EDT)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas nba_api requests beautifulsoup4; fi

      - name: Run data update script
        run: python update_nba_data.py

      - name: Commit and push updated CSVs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add nba_logs.csv today_matchups.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily NBA data update" && git push)
